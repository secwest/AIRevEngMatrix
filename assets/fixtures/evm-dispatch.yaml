schema_version: 1
kind: bytecode_format_fixtures
format: evm_runtime_selector_dispatch
description: >
  Synthetic EVM runtime bytecode fragment for checking a disassembler and a
  function-selector dispatch recognizer. Opcodes follow the Ethereum Yellow
  Paper (appendix H, instruction set) and evm.codes. The fragment is the
  standard dispatch preamble: load the first calldata word (PUSH1 0x00,
  CALLDATALOAD), shift the high 4 bytes down to isolate the selector (PUSH1
  0xE0, SHR), then for one known selector DUP1, PUSH4 <selector>, EQ, PUSH2
  <dest>, JUMPI to a JUMPDEST handler, falling through to a PUSH1 0x00 DUP1
  REVERT. The PUSH4 constant is 0xA9059CBB, the published keccak-256-derived
  selector for transfer(address,uint256); it is cited as a known value, not
  recomputed here (no keccak is performed by this fixture). PUSH constants and
  jump offsets are recoverable from the bytes; a selector's human-readable
  signature and parameter names are not, and must be matched against a
  signature database rather than decoded.
bytecode_layout:         # linear-sweep decode; pc is the byte offset
  width: 8-bit opcodes, PUSH<n> carries n immediate bytes (n = opcode - 0x5F)
  sequence:              # [pc, opcode_byte, mnemonic, immediate, meaning]
    - [0,  "60", "PUSH1", "00",       "push 0x00 (calldata offset)"]
    - [2,  "35", "CALLDATALOAD", null, "load 32-byte word at offset 0"]
    - [3,  "60", "PUSH1", "e0",       "push 0xE0 = 224 = 256 - 32 bits"]
    - [5,  "1c", "SHR",   null,       "logical right shift -> high 4 bytes = selector"]
    - [6,  "80", "DUP1",  null,       "duplicate selector for the compare"]
    - [7,  "63", "PUSH4", "a9059cbb", "published selector transfer(address,uint256)"]
    - [12, "14", "EQ",    null,       "selector == 0xA9059CBB ?"]
    - [13, "61", "PUSH2", "0015",     "push jump target 0x0015 = 21"]
    - [16, "57", "JUMPI", null,       "if equal, jump to 21"]
    - [17, "60", "PUSH1", "00",       "fallback: push 0x00"]
    - [19, "80", "DUP1",  null,       "fallback: duplicate"]
    - [20, "fd", "REVERT", null,      "fallback: revert(0, 0)"]
    - [21, "5b", "JUMPDEST", null,    "handler target for the matched selector"]
    - [22, "00", "STOP",  null,       "minimal handler body"]
checks:
  # A disassembler must size each PUSH by its opcode (opcode - 0x5F immediate
  # bytes), compute pc offsets, read the PUSH4 selector constant and the PUSH2
  # JUMPI target from the bytes, and confirm the target lands on a 0x5B
  # JUMPDEST. Undefined/invalid bytes are marked, not guessed into operands.
  push_immediate_size: "opcode - 0x5F bytes"
  selector_shift: "PUSH1 0xE0 then SHR isolates the high 4 bytes of calldata word 0"
  jump_target_must_be_jumpdest: true
  selector_signature_is_a_database_lookup_not_a_decode: true
expected:
  bytecode_hex: "60003560e01c8063a9059cbb1461001557600080fd5b00"
  bytecode_len: 23
  push4_selector_const: "0xa9059cbb"   # cited published selector; not recomputed
  push4_offset: 7
  jumpi_offset: 16
  jumpi_destination_offset: 21         # PUSH2 0x0015
  jumpdest_offset: 21                  # 0x5B byte the JUMPI lands on
  jumpdest_landing_byte: "5b"
  revert_fallback_offset: 20           # PUSH1 0x00 DUP1 REVERT at pc 17..20
  dispatch_recognized: true
cases:
  - id: valid_dispatch
    # The selector compare matches the PUSH4 constant and JUMPI transfers to the
    # JUMPDEST at pc 21; otherwise execution falls through to the REVERT at 20.
    hex: "60003560e01c8063a9059cbb1461001557600080fd5b00"
    expect:
      decodes_cleanly: true
      push4_selector_const: "0xa9059cbb"
      jumpi_destination_offset: 21
      jumpdest_offset: 21
      revert_fallback_offset: 20
      human_readable_signature: candidate   # "transfer(address,uint256)" only via a signature DB
  - id: unknown_opcode
    # Same dispatch preamble through the JUMPDEST at pc 21, then a 0xFE INVALID
    # (a defined, designated-invalid opcode) at pc 22 and a 0x0C byte at pc 23
    # that is unassigned in the instruction set. A decoder marks the 0x0C as an
    # undecoded region rather than inventing an operand or mnemonic for it.
    hex: "60003560e01c8063a9059cbb1461001557600080fd5bfe0c"
    expect:
      invalid_opcode_offset: 22        # 0xFE decodes as INVALID
      undefined_byte_offset: 23        # 0x0C unassigned -> undecoded region
      undefined_byte_marked_undecoded: true
      decoder_guesses_operands: false
result:
  outcome: unobserved   # set to recorded after a disassembler runs these cases
  parser_engine: null
  parser_version: null
  limitations: >
    Synthetic fragment with no constructor, metadata hash, storage layout, or
    library linking. Recovering the PUSH4 constant and the dispatch offsets does
    not establish the matched function's human-readable signature or parameter
    names: 0xA9059CBB is reported as the published selector for
    transfer(address,uint256), but a selector is a 4-byte truncated hash and any
    signature mapped to it is a candidate from a signature database, not a value
    decoded from the bytes. A clean disassembly also does not establish that the
    contract was deployed, that the handler is reachable, or what it does; those
    are analyzed at their own layers. No keccak-256 is computed by this fixture.
