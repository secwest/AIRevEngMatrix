schema_version: 1
kind: firmware_image_fixtures
format: android_boot_image_v4
description: >
  Synthetic Android boot image header v4 (AOSP mkbootimg bootimg.h, 1584 bytes,
  all little-endian, packed). v3/v4 fix page_size at 4096 and drop the v0-v2
  load-address and SHA1 id fields; load addresses come from vendor_boot. There
  is no in-header checksum in v3/v4, so correctness here is structural: offsets,
  the os_version bit packing, and the page-aligned section layout.
header_layout:
    - [0, 8, magic, "ANDROID!"]
    - [8, 4, kernel_size, null]
    - [12, 4, ramdisk_size, null]
    - [16, 4, os_version, "packed: see os_version_encoding"]
    - [20, 4, header_size, "1584"]
    - [24, 16, reserved, "zero"]
    - [40, 4, header_version, "4"]
    - [44, 1536, cmdline, "512+1024 bytes, NUL-padded"]
    - [1580, 4, signature_size, "boot signature (AVB) size in bytes"]
os_version_encoding: >
  bits[31:25]=major, [24:18]=minor, [17:11]=patch of A.B.C; bits[10:4]=year-2000,
  bits[3:0]=month. This fixture encodes 13.0.0 with security patch 2024-08.
section_layout: >
  Each section is zero-padded to a multiple of page_size (4096): header (1 page),
  then kernel, then ramdisk, then (v4) the boot signature.
checks:
  magic_offset: 0
  header_size_field: 1584
expected:
  header_hex: 
  header_sha256: 52e9cb27a907195c4c134444cd2b12073be594928708ee26c8bcd541abf0c038
  magic_ok: true
  header_version: 4
  header_size: 1584
  kernel_size: 4660
  ramdisk_size: 2202
  os_version_raw: "0x1a000188"
  decoded_os_version: "13.0.0"
  decoded_security_patch: "2024-08"
  signature_size: 288
result:
  outcome: unobserved
  parser_engine: null
  limitations: >
    Header only; no kernel, ramdisk, or boot signature payloads are attached, so
    the page-aligned offsets are described but not materialized. A parsed header
    does not establish the referenced images are present, signed, or accepted by
    the bootloader; v3/v4 load addresses are not in this header at all.
