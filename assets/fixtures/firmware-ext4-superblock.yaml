schema_version: 1
kind: firmware_format_fixtures
format: ext4_superblock
description: >
  Synthetic ext4 superblock (1024 bytes, located at byte offset 1024 in a real
  image), from the Linux ext4 on-disk layout. All fields little-endian. This is
  a STRUCTURAL fixture: it checks field decoding and the block-size formula, not
  the metadata_csum value. The s_checksum (offset 1020) is crc32c (Castagnoli
  poly 0x1EDC6F41) seeded from the filesystem UUID over the first 1020 bytes and
  is only present when the ro_compat metadata_csum feature is set; computing and
  confirming it requires crc32c and an independent oracle (dumpe2fs/e2fsck), so
  no checksum value is asserted here.
superblock_layout:
    - [0, 4, s_inodes_count, "8192"]
    - [4, 4, s_blocks_count_lo, "16384"]
    - [20, 4, s_first_data_block, "0 (because block size > 1 KiB)"]
    - [24, 4, s_log_block_size, "2 -> block size = 1024 << 2 = 4096"]
    - [32, 4, s_blocks_per_group, "8192"]
    - [40, 4, s_inodes_per_group, "2048"]
    - [56, 2, s_magic, "0xEF53 (on disk 53 EF)"]
    - [58, 2, s_state, "1 = cleanly unmounted"]
    - [76, 4, s_rev_level, "1 = DYNAMIC (gates the offset-84+ fields)"]
    - [88, 2, s_inode_size, "256"]
    - [90, 2, s_block_group_nr, "0 for the primary superblock, nonzero in backups"]
    - [100, 4, s_feature_ro_compat, "0x0400 metadata_csum bit set"]
    - [104, 16, s_uuid, null]
    - [120, 16, s_volume_name, "rvmxroot, NUL-padded"]
    - [373, 1, s_checksum_type, "1 = crc32c"]
    - [1020, 4, s_checksum, "crc32c over first 1020 bytes, UUID-seeded (not asserted)"]
checks:
  magic_offset: 56
  block_size_formula: "1024 << s_log_block_size"
  dynamic_rev_gate: "offsets 84+ valid only when s_rev_level >= 1"
  primary_superblock: "s_block_group_nr == 0"
expected:
  superblock_hex: 
  superblock_sha256: 2a45dd9d4e1532636b2f3c701cce476eb35c4c0a6444652b5890891e4a171e20
  magic_ok: true
  block_size: 4096
  rev_level: 1
  inode_size: 256
  block_group_nr: 0
  volume_name: "rvmxroot"
  metadata_csum_feature_declared: true
  s_checksum_method: "crc32c (poly 0x1EDC6F41), seeded from s_uuid, over bytes 0..1019; verify with an independent tool"
result:
  outcome: unobserved
  parser_engine: null
  limitations: >
    A valid magic and self-consistent geometry do not establish a mountable
    filesystem; block group descriptors, inodes, and data blocks are absent. The
    metadata_csum value is intentionally not asserted because crc32c differs from
    the GPT/zlib CRC32 and the ext4 seed/convention must be confirmed against an
    independent implementation, not this fixture.
