schema_version: 1
kind: behavior_fixtures
source: rust-patterns.rs
source_language: rust
edition: "2021"
dependencies: standard_library_only
build_profiles:
  - name: debug
    rustc_args: ["--edition=2021", "-C", "opt-level=0", "-C", "debuginfo=2"]
  - name: optimized
    rustc_args: ["--edition=2021", "-C", "opt-level=2", "-C", "strip=symbols"]
comparison:
  stdout_normalization: crlf_to_lf
  stderr: ""
  exit_code: 0
cases:
  - id: missing
    argv: []
    stdout: "err:missing\n"
  - id: zero
    argv: ["0"]
    stdout: "ok:7\n"
  - id: ordinary
    argv: ["8"]
    stdout: "ok:15\n"
  - id: maximum_success
    argv: ["248"]
    stdout: "ok:255\n"
  - id: arithmetic_overflow
    argv: ["249"]
    stdout: "err:overflow\n"
  - id: parse_range
    argv: ["256"]
    stdout: "err:invalid\n"
  - id: parse_text
    argv: ["invalid"]
    stdout: "err:invalid\n"
  - id: negative
    argv: ["-1"]
    stdout: "err:invalid\n"
  - id: empty
    argv: [""]
    stdout: "err:invalid\n"
  - id: fractional
    argv: ["1.5"]
    stdout: "err:invalid\n"
analysis_checks:
  - Bind parse_input and the result cases to actual instructions.
  - Inspect the checked addition and its error return.
  - Identify whether the selected build retains an indirect trait call.
  - Record enum and ABI hypotheses without assuming a fixed layout.
  - Distinguish behavior validation from successful decompiler reconstruction.

observed_on_reference_build:
  # Answers recorded from an actual build so the checks above are falsifiable.
  # These describe this toolchain/target; confirm against the instructions of
  # the build under analysis before relying on them elsewhere.
  toolchain: "rustc 1.95.0"
  target: x86_64
  findings:
    - check: indirect_trait_call_retained
      debug: yes
      optimized: yes
      evidence: >
        main erases &Add to &dyn Transform through std::hint::black_box, and
        invoke/apply carry #[inline(never)]. Both profiles keep invoke as a
        distinct function containing an indirect call through the trait object's
        vtable whose slot targets the Add::apply body; opt-level=2 does not
        devirtualize it (one indirect call in the optimized asm).
    - check: inline_never_functions_distinct
      debug: [parse_input, invoke, apply]
      optimized: [parse_input, invoke, apply]
      evidence: >
        All three remain distinct, non-inlined functions in both profiles. With
        -C strip=symbols the optimized binary drops their names, but the call
        structure (the indirect dispatch and the separate apply body) survives.
    - check: checked_add_overflow_path
      both: present
      evidence: >
        Add::apply lowers value.checked_add(amount) to an add that tests the
        carry/overflow flag (setb/jo in the optimized asm) and selects the
        Problem::Overflow return; argv "249" yields err:overflow.
